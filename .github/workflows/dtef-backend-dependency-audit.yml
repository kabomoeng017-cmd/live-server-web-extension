name: DTEF backend dependency audit

on:
  push:
    branches:
      - dtef-3.0-milestone-4.2
    paths:
      - 'DTEF_3_0_Hardened/backend/**'
      - '.github/workflows/dtef-backend-dependency-audit.yml'
  schedule:
    - cron: '23 2 * * 1'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  backend-osv-scan:
    name: OSV scan of Maven backend dependencies
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.7.1
    with:
      scan-args: |-
        -r
        DTEF_3_0_Hardened/backend
      upload-sarif: false
      fail-on-vuln: true
