name: DTEF backend dependency audit

on:
  push:
    branches:
      - dtef-3.0-milestone-4.2
    paths:
      - 'DTEF_3_0_Hardened/backend/**'
      - '.github/workflows/dtef-backend-dependency-audit.yml'
  schedule:
    - cron: '23 2 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-dependency-audit:
    name: OWASP Maven dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out DTEF branch
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: DTEF_3_0_Hardened/backend/pom.xml
      - name: Cache OWASP Dependency-Check vulnerability database
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/dependency-check-data
          key: dtef-owasp-data-${{ runner.os }}-${{ hashFiles('DTEF_3_0_Hardened/backend/pom.xml') }}
          restore-keys: |
            dtef-owasp-data-${{ runner.os }}-
      - name: Scan Maven dependencies
        working-directory: DTEF_3_0_Hardened
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          if [[ -n "$NVD_API_KEY" ]]; then
            NVD_ARGS=(-DnvdApiKey="$NVD_API_KEY")
          else
            echo "::warning::NVD_API_KEY is not configured; the scan will use the public NVD feed and may take longer."
            NVD_ARGS=()
          fi
          mvn -B -ntp -f backend/pom.xml \
            org.owasp:dependency-check-maven:13.0.0:check \
            -DfailBuildOnCVSS=11 \
            -Dformat=ALL \
            -DdataDirectory="${{ runner.temp }}/dependency-check-data" \
            "${NVD_ARGS[@]}"
      - name: Upload dependency audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dtef-backend-dependency-audit
          path: |
            DTEF_3_0_Hardened/backend/target/dependency-check-report.html
            DTEF_3_0_Hardened/backend/target/dependency-check-report.json
            DTEF_3_0_Hardened/backend/target/dependency-check-report.csv
          if-no-files-found: warn
          retention-days: 30
