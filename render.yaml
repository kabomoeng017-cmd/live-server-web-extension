# DTEF 3.0 public demonstration environment.
# Demo-only: no production government systems or real student records.
services:
  - type: web
    name: dtef-demo-api
    runtime: docker
    dockerfilePath: DTEF_3_0_Hardened/backend/Dockerfile
    dockerContext: DTEF_3_0_Hardened/backend
    region: frankfurt
    plan: free
    autoDeployTrigger: checksPass
    healthCheckPath: /actuator/health/readiness
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: demo
      - key: DB_HOST
        fromDatabase:
          name: dtef-demo-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: dtef-demo-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: dtef-demo-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: dtef-demo-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: dtef-demo-db
          property: password
      - key: SPRING_DATA_REDIS_URL
        fromService:
          type: keyvalue
          name: dtef-demo-redis
          property: connectionString
      - key: SPRING_RABBITMQ_LISTENER_SIMPLE_AUTO_STARTUP
        value: "false"
      - key: MANAGEMENT_HEALTH_RABBIT_ENABLED
        value: "false"
      - key: JWT_SECRET_BASE64
        generateValue: true
      - key: DEMO_PASSWORD
        value: DemoPass!2026
      - key: DEMO_OTP_LOG_ENABLED
        value: "true"
      - key: DTEF_STORAGE_DIR
        value: /tmp/dtef-demo-uploads
      - key: CORS_ALLOWED_ORIGINS
        fromService:
          type: web
          name: dtef-demo-portal
          envVarKey: RENDER_EXTERNAL_URL

  - type: web
    name: dtef-demo-portal
    runtime: docker
    dockerfilePath: DTEF_3_0_Hardened/frontend/Dockerfile
    dockerContext: DTEF_3_0_Hardened/frontend
    region: frankfurt
    plan: free
    autoDeployTrigger: checksPass
    healthCheckPath: /
    envVars:
      - key: API_INTERNAL_BASE
        fromService:
          type: web
          name: dtef-demo-api
          envVarKey: RENDER_EXTERNAL_URL

  - type: keyvalue
    name: dtef-demo-redis
    region: frankfurt
    plan: free
    ipAllowList: []

databases:
  - name: dtef-demo-db
    databaseName: dtef
    user: dtef
    region: frankfurt
    plan: free
    postgresMajorVersion: "16"
    ipAllowList: []

previews:
  generation: off
