apiVersion: v1
kind: ConfigMap
metadata:
  name: dtef-backend-config
  namespace: dtef
  labels: { app.kubernetes.io/name: dtef }
data:
  SPRING_PROFILES_ACTIVE: "prod"
  SERVER_PORT: "8080"
  DB_POOL_MAX: "10"
  DB_POOL_MIN: "2"
  REDIS_PORT: "6379"
  RABBIT_PORT: "5672"
  DTEF_STORAGE_DIR: "/var/lib/dtef/uploads"
  CORS_ALLOWED_ORIGINS: "https://portal.example.gov.bw"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dtef-backend
  namespace: dtef
  labels: { app: dtef-backend }
spec:
  replicas: 3
  revisionHistoryLimit: 5
  selector:
    matchLabels: { app: dtef-backend }
  template:
    metadata:
      labels: { app: dtef-backend }
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 40
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: backend
          image: registry.example.gov.bw/dtef/backend:3.0.0
          imagePullPolicy: IfNotPresent
          ports: [{ name: http, containerPort: 8080 }]
          envFrom: [{ configMapRef: { name: dtef-backend-config } }]
          env:
            - name: DB_URL
              valueFrom: { secretKeyRef: { name: dtef-backend-secrets, key: DB_URL } }
            - name: DB_USER
              valueFrom: { secretKeyRef: { name: dtef-backend-secrets, key: DB_USER } }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: dtef-backend-secrets, key: DB_PASSWORD } }
            - name: OIDC_ISSUER_URI
              valueFrom: { secretKeyRef: { name: dtef-backend-secrets, key: OIDC_ISSUER_URI } }
            - name: OIDC_AUDIENCE
              valueFrom: { secretKeyRef: { name: dtef-backend-secrets, key: OIDC_AUDIENCE } }
            - name: REDIS_HOST
              valueFrom: { secretKeyRef: { name: dtef-backend-secrets, key: REDIS_HOST } }
            - name: RABBIT_HOST
              valueFrom: { secretKeyRef: { name: dtef-backend-secrets, key: RABBIT_HOST } }
            - name: RABBIT_USER
              valueFrom: { secretKeyRef: { name: dtef-backend-secrets, key: RABBIT_USER } }
            - name: RABBIT_PASSWORD
              valueFrom: { secretKeyRef: { name: dtef-backend-secrets, key: RABBIT_PASSWORD } }
          resources:
            requests: { cpu: "500m", memory: "768Mi" }
            limits: { cpu: "2", memory: "2Gi" }
          startupProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            failureThreshold: 30
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            initialDelaySeconds: 20
            periodSeconds: 20
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: http }
            initialDelaySeconds: 15
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: uploads, mountPath: /var/lib/dtef/uploads }
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 128Mi }
        - name: uploads
          persistentVolumeClaim: { claimName: dtef-uploads }
---
apiVersion: v1
kind: Service
metadata:
  name: dtef-backend
  namespace: dtef
spec:
  selector: { app: dtef-backend }
  ports: [{ name: http, port: 8080, targetPort: http }]
  type: ClusterIP
