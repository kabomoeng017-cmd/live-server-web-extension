apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: dtef-backend-hpa
  namespace: dtef
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: dtef-backend }
  minReplicas: 3
  maxReplicas: 30
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 65 }
    - type: Resource
      resource:
        name: memory
        target: { type: Utilization, averageUtilization: 75 }
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - { type: Percent, value: 100, periodSeconds: 60 }
        - { type: Pods, value: 5, periodSeconds: 60 }
      selectPolicy: Max
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - { type: Percent, value: 25, periodSeconds: 60 }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: dtef-frontend-hpa
  namespace: dtef
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: dtef-frontend }
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
