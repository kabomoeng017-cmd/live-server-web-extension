apiVersion: apps/v1
kind: Deployment
metadata:
  name: dtef-frontend
  namespace: dtef
  labels: { app: dtef-frontend }
spec:
  replicas: 3
  selector:
    matchLabels: { app: dtef-frontend }
  template:
    metadata:
      labels: { app: dtef-frontend }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: frontend
          image: registry.example.gov.bw/dtef/frontend:3.0.0
          imagePullPolicy: IfNotPresent
          ports: [{ name: http, containerPort: 3000 }]
          resources:
            requests: { cpu: "250m", memory: "384Mi" }
            limits: { cpu: "1", memory: "1Gi" }
          readinessProbe:
            httpGet: { path: /, port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /, port: http }
            initialDelaySeconds: 30
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: next-cache, mountPath: /app/.next/cache }
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 128Mi }
        - name: next-cache
          emptyDir: { sizeLimit: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: dtef-frontend
  namespace: dtef
spec:
  selector: { app: dtef-frontend }
  ports: [{ name: http, port: 3000, targetPort: http }]
  type: ClusterIP
