version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: '03:00'
    open-pull-requests-limit: 5
    groups:
      frontend-framework:
        patterns:
          - 'next'
          - 'react'
          - 'react-dom'
      frontend-tooling:
        patterns:
          - '@types/*'
          - 'typescript'
          - '@playwright/test'
  - package-ecosystem: maven
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      time: '03:30'
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '04:00'
    open-pull-requests-limit: 5
