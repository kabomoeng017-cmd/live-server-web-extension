name: DTEF security validation
on:
  pull_request:
  push:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:
    inputs:
      run_active_scan:
        description: 'Run an active OWASP ZAP scan against an explicitly authorized staging host'
        type: boolean
        required: true
        default: false
      confirm_written_authorization:
        description: 'Confirm written authorization has been granted by the staging system owner'
        type: boolean
        required: true
        default: false
      target_url:
        description: 'HTTPS staging base URL; must match DTEF_PENTEST_ALLOWED_HOST in the security-testing environment'
        type: string
        required: false

permissions:
  contents: read

jobs:
  passive-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Start isolated demo environment
        run: |
          cp .env.example .env
          docker compose up -d --build
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/ >/dev/null && curl -fsS http://127.0.0.1:8080/api/health >/dev/null; then exit 0; fi
            sleep 5
          done
          docker compose logs --no-color
          exit 1
      - name: Run passive OWASP ZAP baseline scan
        run: |
          mkdir -p security-artifacts
          docker run --rm --network host \
            -v "$PWD/security-artifacts:/zap/wrk/:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py -t http://127.0.0.1:3000 -m 5 -T 15 -r zap-frontend.html -J zap-frontend.json
          docker run --rm --network host \
            -v "$PWD/security-artifacts:/zap/wrk/:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py -t http://127.0.0.1:8080/api/health -m 5 -T 15 -r zap-backend-health.html -J zap-backend-health.json
      - name: Upload passive scan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dtef-zap-baseline
          path: security-artifacts/
          if-no-files-found: ignore
      - name: Stop isolated demo environment
        if: always()
        run: docker compose down -v --remove-orphans

  active-staging-penetration-scan:
    if: github.event_name == 'workflow_dispatch' && inputs.run_active_scan == true && inputs.confirm_written_authorization == true
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: security-testing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify explicit authorization and staging host allow-list
        env:
          TARGET_URL: ${{ inputs.target_url }}
          ALLOWED_HOST: ${{ vars.DTEF_PENTEST_ALLOWED_HOST }}
          AUTHORIZATION_REFERENCE: ${{ vars.DTEF_PENTEST_AUTHORIZATION_REFERENCE }}
        run: |
          test -n "$TARGET_URL" || { echo 'A target URL is required.'; exit 1; }
          test -n "$ALLOWED_HOST" || { echo 'Set DTEF_PENTEST_ALLOWED_HOST in the security-testing environment.'; exit 1; }
          test -n "$AUTHORIZATION_REFERENCE" || { echo 'Set DTEF_PENTEST_AUTHORIZATION_REFERENCE to the written approval/ticket reference.'; exit 1; }
          node --input-type=module <<'NODE'
          const target = new URL(process.env.TARGET_URL);
          const host = target.hostname.toLowerCase();
          const blocked = new Set(['tef.gov.bw', 'www.tef.gov.bw', 'gov.bw', 'www.gov.bw']);
          if (target.protocol !== 'https:' || target.username || target.password || target.search || target.hash) throw new Error('Active scans require a clean HTTPS staging URL.');
          if (host !== process.env.ALLOWED_HOST.toLowerCase()) throw new Error('Target hostname does not match the explicit staging allow-list.');
          if (blocked.has(host)) throw new Error('Known live government hosts are blocked from active scanning.');
          NODE
      - name: Run active OWASP ZAP scan against approved staging only
        env:
          TARGET_URL: ${{ inputs.target_url }}
          AUTHORIZATION_REFERENCE: ${{ vars.DTEF_PENTEST_AUTHORIZATION_REFERENCE }}
        run: |
          mkdir -p security-artifacts
          printf 'Written authorization reference: %s\n' "$AUTHORIZATION_REFERENCE" > security-artifacts/authorization.txt
          docker run --rm --network host \
            -v "$PWD/security-artifacts:/zap/wrk/:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-full-scan.py -t "$TARGET_URL" -m 10 -T 30 -r zap-active.html -J zap-active.json
      - name: Upload active scan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dtef-zap-active-penetration-report
          path: security-artifacts/
          if-no-files-found: ignore
