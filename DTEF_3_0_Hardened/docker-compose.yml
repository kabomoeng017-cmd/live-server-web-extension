name: dtef-3
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: dtef
      POSTGRES_USER: dtef
      POSTGRES_PASSWORD: ${DB_PASSWORD:-dtef_dev_password}
    ports: ["5432:5432"]
    volumes: ["dtef_pg:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dtef -d dtef"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    ports: ["6379:6379"]
    volumes: ["dtef_redis:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBIT_USER:-dtef}
      RABBITMQ_DEFAULT_PASS: ${RABBIT_PASSWORD:-dtef_local_only}
    ports: ["5672:5672", "15672:15672"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: demo
      DB_URL: jdbc:postgresql://postgres:5432/dtef
      DB_USER: dtef
      DB_PASSWORD: ${DB_PASSWORD:-dtef_dev_password}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RABBIT_HOST: rabbitmq
      RABBIT_PORT: 5672
      RABBIT_USER: ${RABBIT_USER:-dtef}
      RABBIT_PASSWORD: ${RABBIT_PASSWORD:-dtef_local_only}
      JWT_SECRET_BASE64: ${JWT_SECRET_BASE64:-MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-DemoPass!2026}
      DEMO_OTP_LOG_ENABLED: ${DEMO_OTP_LOG_ENABLED:-true}
      DTEF_STORAGE_DIR: /var/lib/dtef/uploads
      CORS_ALLOWED_ORIGINS: http://localhost:3000
    ports: ["8080:8080"]
    volumes: ["dtef_uploads:/var/lib/dtef/uploads"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health/readiness >/dev/null"]
      interval: 20s
      timeout: 5s
      start_period: 50s
      retries: 5
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        API_INTERNAL_BASE: http://backend:8080/api
    environment:
      NODE_ENV: production
    ports: ["3000:3000"]
    depends_on:
      backend: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ >/dev/null"]
      interval: 20s
      timeout: 5s
      start_period: 30s
      retries: 5
    restart: unless-stopped

  government-simulator:
    image: node:22-alpine
    profiles: ["integration-sim"]
    working_dir: /app
    user: "1000:1000"
    command: ["node", "server.mjs"]
    environment:
      PORT: 9090
    volumes:
      - ./tests/gov-sim:/app:ro
    ports: ["127.0.0.1:9090:9090"]
    read_only: true
    tmpfs: ["/tmp"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:9090/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  dtef_pg:
  dtef_redis:
  dtef_uploads:
